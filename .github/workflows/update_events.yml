name: Auto Update Live Events Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-events:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: 4. Buat Folder Output
        run: mkdir -p LiveEvents

      - name: 5. Run Live Events Scraper
        env:
          PYTHONIOENCODING: utf-8
        run: python live_events_scraper.py

      - name: 6. Auto Commit & Push M3U8 Terbaru
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LiveEvents/* || true
          if ! git diff --cached --quiet; then
            git commit -m "⚡ Auto Update: Refresh Live Events M3U8 - $(date '+%d/%m/%Y %H:%M:%S')"
            git push origin main
            echo "✅ Push playlist Live Events berhasil!"
          else
            echo "ℹ️ Tidak ada perubahan pada playlist Live Events."
          fi
